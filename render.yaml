# ==============================================
# Render Infrastructure as Code
# Enterprise Spare Inventory Management System
# ==============================================

services:
  # ── Backend API (Node.js + Express + Prisma) ──────────────────────────────
  - type: web
    name: spare-ims-backend
    runtime: node
    rootDir: backend
    buildCommand: cd backend && npm install && npm run build:render
    startCommand: cd backend && npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spare-ims-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: PORT
        value: 5000
      - key: FRONTEND_URL
        value: https://spare-ims-frontend.onrender.com
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE_MB
        value: 10
      - key: TZ
        value: Asia/Kolkata
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100

  # ── Frontend Static Site (Vite + React) ──────────────────────────────────
  - type: web
    name: spare-ims-frontend
    runtime: static
    rootDir: frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    plan: free
    envVars:
      - key: VITE_API_URL
        value: https://spare-ims-backend.onrender.com/api
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: spare-ims-db
    plan: free
    databaseName: spare_inventory_db
    user: spare_admin
