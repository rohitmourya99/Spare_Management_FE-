# ==============================================
# Render Infrastructure as Code - Single Site Deployment
# Enterprise Spare Inventory Management System
# ==============================================

services:
  # ── Unified Web Service (Express API + React Frontend on 1 Single URL) ──────
  - type: web
    name: spare-inventory-system
    runtime: node
    buildCommand: npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: spare-ims-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_FILE_SIZE_MB
        value: 10
      - key: TZ
        value: Asia/Kolkata
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100

# ── Free PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: spare-ims-db
    plan: free
    databaseName: spare_inventory_db
    user: spare_admin
